# Optional: mount DEJOIY config from host without rebuilding (development / hotfix).
# cp docker-compose.override.example.yml docker-compose.override.yml
services:
  dejoiy-init:
    volumes:
      - ../lib/dejoiy:/opt/zammad/lib/dejoiy:ro
      - ../config/initializers/dejoiy_brand_scrub.rb:/opt/zammad/config/initializers/dejoiy_brand_scrub.rb:ro
  dejoiy-railsserver:
    volumes:
      - ../lib/dejoiy:/opt/zammad/lib/dejoiy:ro
      - ../config/initializers/dejoiy_brand_scrub.rb:/opt/zammad/config/initializers/dejoiy_brand_scrub.rb:ro
  dejoiy-scheduler:
    volumes:
      - ../lib/dejoiy:/opt/zammad/lib/dejoiy:ro
  dejoiy-websocket:
    volumes:
      - ../lib/dejoiy:/opt/zammad/lib/dejoiy:ro
      - ./stubs/noop-initializer.rb:/opt/zammad/config/initializers/dejoiy_email_notification_check.rb:ro
  dejoiy-nginx:
    volumes:
      - ../lib/dejoiy:/opt/zammad/lib/dejoiy:ro
      - ./stubs/noop-initializer.rb:/opt/zammad/config/initializers/dejoiy_email_notification_check.rb:ro
      - ../public/favicon.svg:/opt/zammad/public/favicon.svg:ro
      - ../public/favicon.ico:/opt/zammad/public/favicon.ico:ro
      - ../public/apple-touch-icon.png:/opt/zammad/public/apple-touch-icon.png:ro
